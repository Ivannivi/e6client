name: Build and Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (optional)'
        required: false
        default: 'auto'

permissions:
  contents: write
  packages: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npx tsc --noEmit

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

  build-android:
    needs: [typecheck, test]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Read version from package.json
        id: pkg
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          echo "version_code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Inject Android version
        run: |
          sed -i "s/versionCode .*/versionCode ${{ steps.pkg.outputs.version_code }}/" android/app/build.gradle
          sed -i "s/versionName \".*\"/versionName \"${{ steps.pkg.outputs.version }}\"/" android/app/build.gradle

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Android signing keystore
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/e6client.keystore
          else
            keytool -genkey -v -keystore android/app/e6client.keystore -alias e6client -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=e6client" >/dev/null 2>&1
          fi

      - name: Build Android release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Sign and align release APK
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'android' }}
        run: |
          cd android
          UNSIGNED=app/build/outputs/apk/release/app-release-unsigned.apk
          SIGNED=app/build/outputs/apk/release/e6client.apk
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore app/e6client.keystore -storepass "$KS_PASS" -keypass "$KS_PASS" "$UNSIGNED" e6client
          ZIPALIGN=$(find "${ANDROID_SDK_ROOT}/build-tools" -name zipalign | sort -V | tail -1)
          "$ZIPALIGN" -v 4 "$UNSIGNED" "$SIGNED"

      - name: Rename APK with version
        run: |
          VERSION=${{ steps.pkg.outputs.version }}
          mv android/app/build/outputs/apk/release/e6client.apk "android/app/build/outputs/apk/release/e6client-${VERSION}-android.apk"

      - name: Upload Android APK
        uses: actions/upload-artifact@v5
        with:
          name: android-apk
          path: android/app/build/outputs/apk/release/e6client-*-android.apk

  build-ios:
    needs: [typecheck, test]
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Read version from package.json
        id: pkg
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          echo "build_number=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Set iOS version and build number
        run: |
          cd ios/App
          agvtool new-marketing-version "${{ steps.pkg.outputs.version }}"
          agvtool new-version -all ${{ steps.pkg.outputs.build_number }}

      - name: Build iOS app (no signing)
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Create IPA
        run: |
          mkdir -p ios/App/build/Payload
          cp -r ios/App/build/Build/Products/Release-iphoneos/App.app ios/App/build/Payload/
          cd ios/App/build
          zip -r "e6client-${{ steps.pkg.outputs.version }}-ios.ipa" Payload

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v5
        with:
          name: ios-ipa
          path: ios/App/build/e6client-*-ios.ipa

  build-linux:
    needs: [typecheck, test]
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
            artifact: linux-x64-artifacts
          - arch: arm64
            runner: ubuntu-latest
            artifact: linux-arm64-artifacts
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        run: npm run build

      - name: Build Linux App (${{ matrix.arch }})
        run: npx electron-builder --linux --${{ matrix.arch }} --publish=never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux artifacts (${{ matrix.arch }})
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
            dist/*.zip

  build-windows:
    needs: [typecheck, test]
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            artifact: windows-x64-artifacts
          - arch: arm64
            runner: windows-11-arm
            artifact: windows-arm64-artifacts
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        run: npm run build

      - name: Build Windows App (${{ matrix.arch }})
        run: npx electron-builder --win --${{ matrix.arch }} --publish=never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows artifacts (${{ matrix.arch }})
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.exe

  build-macos:
    needs: [typecheck, test]
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        run: npm run build

      - name: Build macOS App
        run: npx electron-builder --mac --publish=never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v5
        with:
          name: macos-artifacts
          path: |
            dist/*.dmg
            dist/*.zip

  release:
    needs: [build-android, build-ios, build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Read version from package.json
        id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check if this version was already released
        id: tag_check
        run: |
          if git rev-parse "v${{ steps.pkg.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all artifacts
        if: steps.tag_check.outputs.exists == 'false'
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: List downloaded artifacts
        if: steps.tag_check.outputs.exists == 'false'
        run: find artifacts -type f

      - name: Create Release
        if: steps.tag_check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.pkg.outputs.version }}
          name: e6client v${{ steps.pkg.outputs.version }}
          generate_release_notes: true
          files: |
            artifacts/android-apk/*
            artifacts/ios-ipa/*
            artifacts/linux-x64-artifacts/*
            artifacts/linux-arm64-artifacts/*
            artifacts/windows-x64-artifacts/*
            artifacts/windows-arm64-artifacts/*
            artifacts/macos-artifacts/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}